<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResumeIQ — Analysis Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --border: #2a2a3a;
      --accent: #7c6bff;
      --accent2: #a78bfa;
      --glow: rgba(124, 107, 255, 0.25);
      --text: #f0f0f8;
      --muted: #8888aa;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), #c084fc); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; background: linear-gradient(90deg, var(--accent2), #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .back-btn {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── MAIN ── */
    .main {
      max-width: 780px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }

    /* ── REPORT HEADER ── */
    .report-header {
      margin-bottom: 40px;
    }
    .report-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52,211,153,0.25);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
      margin-bottom: 18px;
    }
    .report-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .report-subtitle { font-size: 14px; color: var(--muted); }

    /* ── SCORE CARD ── */
    .score-card {
      background: linear-gradient(135deg, rgba(124,107,255,0.15), rgba(192,132,252,0.08));
      border: 1px solid rgba(124,107,255,0.3);
      border-radius: 20px;
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    .score-card::after {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(124,107,255,0.2), transparent 70%);
    }
    .score-ring {
      position: relative;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
    }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
    .ring-bg { stroke: var(--border); }
    .ring-fill { stroke: var(--accent); stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 1.5s ease; }
    .score-num {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
    }
    .score-val { font-size: 26px; font-weight: 700; }
    .score-total { font-size: 11px; color: var(--muted); }

    .score-info h3 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .score-info p { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .score-label {
      display: inline-block;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .label-good { background: rgba(52,211,153,0.15); color: var(--success); }
    .label-avg  { background: rgba(251,191,36,0.15); color: var(--warning); }
    .label-low  { background: rgba(248,113,113,0.15); color: var(--danger); }

    /* ── SECTION CARDS ── */
    .section-grid {
      display: grid;
      gap: 18px;
    }

    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      transition: border-color 0.2s;
    }
    .info-card:hover { border-color: rgba(124,107,255,0.4); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .icon-purple { background: rgba(124,107,255,0.15); }
    .icon-green  { background: rgba(52,211,153,0.15); }
    .icon-yellow { background: rgba(251,191,36,0.15); }
    .icon-red    { background: rgba(248,113,113,0.15); }
    .icon-blue   { background: rgba(96,165,250,0.15); }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .card-content {
      font-size: 15px;
      line-height: 1.75;
      color: #d0d0e8;
    }
    .card-content p { margin-bottom: 6px; }

    /* Skills tags */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 500;
    }
    .tag-skill { background: rgba(124,107,255,0.12); color: var(--accent2); border: 1px solid rgba(124,107,255,0.2); }
    .tag-missing { background: rgba(248,113,113,0.1); color: #fca5a5; border: 1px solid rgba(248,113,113,0.2); }

    /* Bullet list */
    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .bullet-list li {
      display: flex; gap: 10px;
      font-size: 14px;
      color: #d0d0e8;
      line-height: 1.6;
    }
    .bullet-dot { color: var(--accent2); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

    /* Experience badge */
    .exp-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(124,107,255,0.12);
      border: 1px solid rgba(124,107,255,0.25);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--accent2);
      margin-bottom: 10px;
    }

    /* ── ANALYZE AGAIN ── */
    .bottom-row {
      margin-top: 36px;
      display: flex;
      gap: 14px;
    }
    .btn-primary {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--accent), #9f7aea);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px var(--glow); }
    .btn-secondary {
      padding: 14px 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <div class="logo-icon">🧠</div>
  <div class="logo-text">ResumeIQ</div>
  <a href="/" class="back-btn">← Analyze Another</a>
</nav>

<div class="main">
  <div class="report-header">
    <div class="report-tag">✅ Analysis Complete</div>
    <div class="report-title">Your Resume Report</div>
    <div class="report-subtitle">Here's what our AI found in your resume</div>
  </div>

  <!-- Score Card (populated by JS) -->
  <div class="score-card" id="scoreCard">
    <div class="score-ring">
      <svg viewBox="0 0 100 100" width="110" height="110">
        <circle class="ring-bg" cx="50" cy="50" r="45"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="45"/>
      </svg>
      <div class="score-num">
        <div class="score-val" id="scoreVal">–</div>
        <div class="score-total">/100</div>
      </div>
    </div>
    <div class="score-info">
      <h3>ATS Score</h3>
      <p id="scoreDesc">Calculating your score...</p>
      <span class="score-label" id="scoreLabel"></span>
    </div>
  </div>

  <!-- Dynamic Sections -->
  <div class="section-grid" id="sectionGrid">
    <!-- Filled by JS -->
  </div>

  <div class="bottom-row">
    <a href="/" class="btn-primary">✨ Analyze Another Resume</a>
  </div>
</div>

<script>
  const rawResult = {{ result | tojson }};

  // ── PARSER ──
  function extract(text, heading) {
    const regex = new RegExp(`\\*\\*${heading}\\*\\*\\s*([\\s\\S]*?)(?=\\*\\*[A-Z]|$)`, 'i');
    const match = text.match(regex);
    return match ? match[1].trim() : null;
  }

  function extractScore(text) {
    const match = text.match(/(\d{1,3})\s*\/\s*100/);
    return match ? parseInt(match[1]) : null;
  }

  function toTags(str, cls) {
    return str.split(/[,\n]/).map(s => s.replace(/^[-•*\d.]\s*/, '').trim()).filter(Boolean)
      .map(s => `<span class="tag ${cls}">${s}</span>`).join('');
  }

  function toBullets(str) {
    return str.split('\n').map(s => s.replace(/^[•*-]\s*/, '').trim()).filter(Boolean)
      .map(s => `<li><span class="bullet-dot">→</span>${s}</li>`).join('');
  }

  // ── POPULATE ──
  const summary    = extract(rawResult, 'CANDIDATE SUMMARY');
  const skills     = extract(rawResult, 'KEY SKILLS');
  const expLevel   = extract(rawResult, 'EXPERIENCE LEVEL');
  const atsSection = extract(rawResult, 'ATS SCORE');
  const missing    = extract(rawResult, 'MISSING SKILLS');
  const tips       = extract(rawResult, 'IMPROVEMENT SUGGESTIONS');

  // Score ring
  const score = extractScore(rawResult);
  if (score !== null) {
    document.getElementById('scoreVal').textContent = score;
    const offset = 283 - (283 * score / 100);
    setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
    const label = document.getElementById('scoreLabel');
    if (score >= 75) { label.textContent = 'Strong'; label.className = 'score-label label-good'; }
    else if (score >= 50) { label.textContent = 'Moderate'; label.className = 'score-label label-avg'; }
    else { label.textContent = 'Needs Work'; label.className = 'score-label label-low'; }
  }

  const atsDesc = atsSection ? atsSection.replace(/\d+\s*\/\s*100\s*/, '').trim() : '';
  document.getElementById('scoreDesc').textContent = atsDesc || 'Your ATS compatibility score.';

  // Build section cards
  const grid = document.getElementById('sectionGrid');
  const sections = [];

  if (summary) sections.push({
    icon: '👤', iconCls: 'icon-purple', label: 'Candidate Summary',
    html: `<div class="card-content"><p>${summary}</p></div>`
  });

  if (skills) sections.push({
    icon: '⚡', iconCls: 'icon-green', label: 'Key Skills Detected',
    html: `<div class="tags">${toTags(skills, 'tag-skill')}</div>`
  });

  if (expLevel) {
    const level = expLevel.split('\n')[0].trim();
    const note  = expLevel.split('\n').slice(1).join(' ').trim();
    sections.push({
      icon: '📈', iconCls: 'icon-blue', label: 'Experience Level',
      html: `<div class="exp-badge">🏆 ${level}</div>${note ? `<p style="font-size:14px;color:var(--muted);margin-top:4px">${note}</p>` : ''}`
    });
  }

  if (missing) sections.push({
    icon: '🔍', iconCls: 'icon-yellow', label: 'Missing Skills',
    html: `<div class="tags">${toTags(missing, 'tag-missing')}</div>`
  });

  if (tips) sections.push({
    icon: '💡', iconCls: 'icon-red', label: 'Improvement Suggestions',
    html: `<ul class="bullet-list">${toBullets(tips)}</ul>`
  });

  sections.forEach(s => {
    grid.innerHTML += `
      <div class="info-card">
        <div class="card-header">
          <div class="card-icon ${s.iconCls}">${s.icon}</div>
          <div class="card-label">${s.label}</div>
        </div>
        ${s.html}
      </div>`;
  });

  // Fallback: if no sections parsed, show raw
  if (!sections.length) {
    grid.innerHTML = `<div class="info-card"><div class="card-content" style="white-space:pre-wrap">${rawResult}</div></div>`;
  }
</script>
</body>
</html>
